*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:var(--bg);color:var(--ink);font:1.1rem/1.5 system-ui,sans-serif;text-align:center;padding:1.5rem}

.g{transform-box:fill-box;transform-origin:center;fill-rule:evenodd}
.g1{fill:var(--a);animation:cw 6s linear infinite}
.g2{fill:var(--b);animation:ccw 4s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
h1{font-size:clamp(1.6rem,5vw,2.4rem)}
p{opacity:.7}
@media (prefers-reduced-motion:reduce){.g{animation-duration:30s}}
