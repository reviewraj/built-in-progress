<style>
:root{--bg:#f4f6fa;--ink:#16213a;--accent:#2d4bff}

*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:var(--bg);color:var(--ink);font:1.1rem/1.5 system-ui,sans-serif;text-align:center;padding:1.5rem}
svg{width:min(34vw,140px);height:auto;color:var(--accent);animation:spin 2.4s linear infinite}
h1{font-size:clamp(1.6rem,5vw,2.4rem)}
p{opacity:.7}
